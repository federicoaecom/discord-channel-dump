schema: spec-driven

project:
  name: discord-channel-dump
  path: E:\\ECOM\\DISCORD-BACKUP

context: |
  Node.js CLI utility (discord-channel-dump) that backs up Discord text channels via Playwright browser automation.
  Calls Discord's authenticated REST API from the browser to fetch messages and media, then writes messages.json and an offline HTML viewer.
  Architecture: plain CommonJS modules with a bin/ + src/ layout: executable entries in bin/ and library code in src/.
  Tests use node:test; ESLint, Prettier, and GitHub Actions CI are available.

strict_tdd: false

testing:
  strict_tdd: false
  workspace_test_command: npm test
  projects:
    - path: .
      stack: Node.js CommonJS CLI (Node ^20.19.0 || ^22.13.0 || >=24)
      test_command: npm test
      framework: node:test with Playwright browser tests
      coverage_command: "—"
      linter_command: npm run lint
      type_checker_command: "—"
      formatter_command: npm run format:check
  layers:
    unit:
      available: true
      tool: node:test
    integration:
      available: true
      tool: node:test with local fixture servers and subprocesses
    e2e:
      available: true
      tool: Playwright 1.62.1 via node:test
  coverage:
    available: false
    command: "—"
  quality:
    linter:
      available: true
      command: npm run lint
    type_checker:
      available: false
      command: "—"
    formatter:
      available: true
      command: npm run format:check

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing CommonJS module patterns
      - Keep config.js as single source of truth for tunables
    tdd: false
    test_command: npm test
  verify:
    test_command: npm test
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

review_budget:
  max_changed_lines: 400
  delivery_strategy: auto-chain
