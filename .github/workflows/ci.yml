name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        if: matrix.node-version == '20.x'
        run: npm audit --omit=dev

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Verify installed package CLI
        if: matrix.node-version == '20.x'
        shell: bash
        run: |
          set -euo pipefail
          package_file=""
          install_root="$RUNNER_TEMP/discord-channel-dump-smoke"
          cleanup() {
            if [[ -n "$package_file" ]]; then rm -f "$package_file"; fi
            rm -rf "$install_root"
          }
          trap cleanup EXIT
          package_file="$(npm pack --silent)"
          npm install --global --prefix "$install_root" --ignore-scripts --no-audit --no-fund "$PWD/$package_file"
          "$install_root/bin/discord-channel-dump" --help | grep -F "Usage:"
          test "$("$install_root/bin/discord-channel-dump" --version)" = "1.0.0"
