name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.0, 22.13.0, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        if: matrix.node-version == '20.19.0'
        run: npm audit --omit=dev

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Verify installed package CLI
        if: matrix.node-version == '20.19.0'
        shell: bash
        run: |
          set -euo pipefail
          package_file=""
          expected_version="$(node -p "require('./package.json').version")"
          install_root="$RUNNER_TEMP/discord-channel-dump-smoke"
          cleanup() {
            if [[ -n "$package_file" ]]; then rm -f "$package_file"; fi
            rm -rf "$install_root"
          }
          trap cleanup EXIT
          package_file="$(npm pack --silent)"
          npm install --global --prefix "$install_root" --ignore-scripts --no-audit --no-fund "$PWD/$package_file"
          "$install_root/bin/discord-channel-dump" --help | grep -F "Uso:"
          "$install_root/bin/discord-channel-dump" --lang en --help | grep -F "Usage:"
          test "$("$install_root/bin/discord-channel-dump" --version)" = "$expected_version"
