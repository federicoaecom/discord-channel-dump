name: Bug report
description: Report something that does not work as expected.
title: "[Bug]: "
labels:
  - "status:needs-review"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Report security vulnerabilities privately instead; see SECURITY.md.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one concise sentence.
      placeholder: The backup stops after downloading the first attachment
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, commands, and options you used.
      placeholder: |
        1. Run `node bin/backup.js --lang en`
        2. Select a channel
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected to happen and what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `node bin/backup.js --version`.
      placeholder: "2.1.1"

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.13.0

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: false
      options:
        - Windows
        - macOS
        - Linux

  - type: dropdown
    id: language
    attributes:
      label: Interface language
      multiple: false
      options:
        - es
        - en

  - type: textarea
    id: output
    attributes:
      label: Relevant terminal output
      description: Paste the relevant output. Remove tokens, cookies, personal data, and message content first.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed any Discord tokens, cookies, personal data, and message content from this report.
          required: true
